</style>
</head>

    const chips=h("div",{style:"display:flex;flex-wrap:wrap;gap:6px"},...tagList.map(t=>{const b=h("button",{class:"btn alt",style:"padding:6px 10px;font-size:13px",onclick:()=>{const i=st.tags.indexOf(t);i<0?st.tags.push(t):st.tags.splice(i,1);b.style.background=i<0?"var(--ink)":"";b.style.color=i<0?"var(--bg)":""}},t);return b}));

}
